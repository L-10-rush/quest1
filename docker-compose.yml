services:
  dialogue-finder:
    build: .
    image: video-dialogue-finder:latest
    env_file:
      - path: .env
        required: false
    volumes:
      - ./work:/app/work
      - ./output:/app/output
    # No default --url/--text: pass them at run time, e.g.
    #   docker compose run --rm dialogue-finder --url <URL> --text "<TEXT>"
